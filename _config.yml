title: 风清的个人博客
description: 关于技术、创作与日常的记录。
lang: zh-CN
timezone: Asia/Shanghai
url: "https://fengwuqingchen.github.io"
baseurl: ""
permalink: /posts/:title/
markdown: kramdown
future: false

# Reference documents are deliberately not posts: no home/archive/feed entries.
collections:
  references:
    output: true
    permalink: /references/:name/

author:
  name: 风清

analytics:
  goatcounter_endpoint: "https://fengqing.goatcounter.com/count"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: references
    values:
      layout: post
      reference_only: true
      search_exclude: true
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - test
  - scripts
