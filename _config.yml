title: 风清的个人博客
description: 关于技术、创作与日常的记录。
lang: zh-CN
timezone: Asia/Shanghai
url: "https://fengwuqingchen.github.io"
baseurl: ""
permalink: /posts/:title/
markdown: kramdown
future: false

author:
  name: 风清

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - test
