name: Build and deploy the blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install search indexer
        run: npm ci

      - name: Test publisher and prepare isolated fixture
        run: |
          gem install --user-install nokogiri --no-document
          ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
          ruby test/prepare_site_fixture.rb _site-fixture

      - name: Build isolated integration fixture
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site-fixture/source
          destination: ./_site-fixture/site

      - name: Verify isolated integration fixture
        run: ruby test/verify_site_fixture.rb _site-fixture

      - name: Generate category pages
        run: ruby scripts/generate-category-pages.rb

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Make the generated site writable
        run: sudo chown -R "$USER":"$USER" _site

      - name: Build Pagefind search index
        run: npm run search:index

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
