<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">风</span>
          <span>{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">文章</a>
          <a href="{{ '/about/' | relative_url }}">关于</a>
          <a href="{{ '/feed.xml' | relative_url }}">订阅</a>
        </nav>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }}。文字留在这里，时间继续向前。</p>
        <a href="https://github.com/fengwuqingchen">GitHub</a>
      </div>
    </footer>
  </body>
</html>
